name: e2e

# End-to-end: S3 (rclone) + Flight SQL server (release e2e-assets) + Trino with this plugin, TPC-H SF1
# vs e2e/ci/reference/sf1. Runs on request, and on pushes that change plugin code or the e2e setup
# (Actions minutes are limited).
on:
  workflow_dispatch:
    inputs:
      trino:
        description: 'Trino version (455, 477, 483)'
        default: '455'
      result-mode:
        description: 'Server result mode (partial or complete)'
        default: 'partial'
      servers:
        description: 'Flight servers: 1, 3 (cluster + failover checks) or both'
        default: 'both'
      server-build:
        description: 'Flight server build from e2e-assets: int7, or a server CI build id such as 45fc0a9e6e02 (int4-int6 were removed)'
        default: '45fc0a9e6e02'
      iceberg-warehouse:
        description: 'Iceberg warehouse for int5+ (local directory or s3 = the rclone bucket, written through s3a)'
        default: 'local'
      iceberg-core-site:
        description: 'Put core-site.xml (fs.file.impl=LocalFileSystem) on the server classpath: 1, 0, or empty = 1 for int5/int6 only'
        default: ''
      heap-probe:
        description: 'Trino heap probe (e2e/ci/heap-probe.sh): 0, 1 (after the TPC-H suite) or only'
        default: '0'
      heap-probe-xmx:
        description: 'Trino heaps for the probe, space-separated'
        default: '640M 1G 1536M'
      profile:
        description: 'Throughput profile (e2e/ci/profile.sh: TPC-H times, query stats, JFR CPU samples, read benchmark): 0, only, or bench (read benchmark only)'
        default: '0'
      profile-settings:
        description: 'Profile settings: default and/or comma-separated session settings, space-separated'
        default: 'default flight.split_count=16'
  push:
    branches: [main, 'claude/**']
    paths:
      - 'arrow-flight-common/src/main/**'
      - 'trino-arrow-flight/src/**'
      - '**/pom.xml'
      - 'e2e/ci/*.sh'
      - 'e2e/ci/*.py'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}-${{ inputs.trino }}-${{ inputs.result-mode }}-${{ inputs.server-build }}-${{ inputs.iceberg-warehouse }}-${{ inputs.iceberg-core-site }}-${{ inputs.heap-probe }}-${{ inputs.profile }}
  cancel-in-progress: true

# e2e-assets is a published pre-release, so a read token can list and download its assets.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # int6 complete 3 servers incl. Iceberg needs ~31 min (run 39927746471)
    strategy:
      fail-fast: false
      matrix:
        servers: ${{ fromJSON((inputs.servers == '1' && '[1]') || (inputs.servers == '3' && '[3]') || '[1,3]') }}
    env:
      SERVERS: ${{ matrix.servers }}
      TRINO_VERSION: ${{ inputs.trino || '455' }}
      RESULT_MODE: ${{ inputs.result-mode || 'partial' }}
      SERVER_BUILD: ${{ inputs.server-build || '45fc0a9e6e02' }}
      ICEBERG_WAREHOUSE: ${{ inputs.iceberg-warehouse || 'local' }}
      ICEBERG_CORE_SITE: ${{ inputs.iceberg-core-site }}
      HEAP_PROBE: ${{ inputs.heap-probe || '0' }}
      HEAP_PROBE_XMX: ${{ inputs.heap-probe-xmx || '640M 1G 1536M' }}
      PROFILE: ${{ inputs.profile || '0' }}
      PROFILE_SETTINGS: ${{ inputs.profile-settings || 'default flight.split_count=16' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn -B -ntp -P trino-$TRINO_VERSION -DskipTests clean package
      - name: Download e2e assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == "e2e-assets") | .assets[] | "\(.id) \(.name)"' |
          while read -r id name; do
            # only the selected server build (the release holds several)
            case "$name" in
              arrow-flight-server-*.jar|*-plugins.tar.zst|flight-plugins-*.tar.zst|flight-server-libs-*.tar.zst)
                case "$name" in *"$SERVER_BUILD"*) ;; *) continue ;; esac ;;
              # shared libs of the intN builds (520 MB); server CI builds ship their own flight-server-libs-1.0.0-<b>
              flight-server-libs.tar.zst)
                case "$SERVER_BUILD" in int*) ;; *) continue ;; esac ;;
            esac
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$RUNNER_TEMP/assets/$name"
          done
          cd "$RUNNER_TEMP/assets" && ls -l
          # START-NOTES.md is documentation only: a mismatch is a warning (seen 2026-10-25: SHA256SUMS names a newer
          # START-NOTES.md than the one uploaded); every jar/tarball must match
          grep -v ' START-NOTES\.md$' SHA256SUMS | sha256sum --check --ignore-missing
          grep ' START-NOTES\.md$' SHA256SUMS | sha256sum --check --ignore-missing ||
            echo "::warning::START-NOTES.md does not match SHA256SUMS (release asset not updated?)"
          # builds not in SHA256SUMS (int7): print the hashes to compare with docs/STATUS.md
          sha256sum arrow-flight-server-*.jar *plugins*.tar.zst flight-server-libs*.tar.zst
      - name: Run e2e
        run: |
          ASSETS="$RUNNER_TEMP/assets" OUT="$RUNNER_TEMP/out" WORK="$RUNNER_TEMP/work" \
          PLUGIN_ZIP="$(ls trino-arrow-flight/target/trino-arrow-flight-*.zip)" \
          e2e/ci/run-e2e.sh
      - name: Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-${{ env.TRINO_VERSION }}-${{ env.SERVER_BUILD }}-${{ env.RESULT_MODE }}-${{ matrix.servers }}srv
          path: ${{ runner.temp }}/out/
          retention-days: 7
